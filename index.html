<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEON BASTION — 타워 디펜스</title>
  <meta name="description" content="타워로 미로를 직접 설계하고 30개 웨이브로부터 코어를 지키는 타워 디펜스.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="NEON BASTION — 타워 디펜스">
  <meta property="og:description" content="타워로 미로를 직접 설계하고 30개 웨이브로부터 코어를 지키는 타워 디펜스.">
  <meta property="og:url" content="https://esin3329.github.io/neon-bastion/">
  <meta property="og:image" content="https://esin3329.github.io/neon-bastion/assets/branding/cover.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="NEON BASTION 홍보 일러스트. 타워 사이로 굽이친 경로를 따라 적이 청록색 코어로 진격하는 장면.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NEON BASTION — 타워 디펜스">
  <meta name="twitter:description" content="타워로 미로를 직접 설계하고 30개 웨이브로부터 코어를 지키는 타워 디펜스.">
  <meta name="twitter:image" content="https://esin3329.github.io/neon-bastion/assets/branding/cover.png">
  <meta name="twitter:image:alt" content="NEON BASTION 홍보 일러스트. 타워 사이로 굽이친 경로를 따라 적이 청록색 코어로 진격하는 장면.">
  <link rel="icon" href="assets/branding/favicon.ico" type="image/vnd.microsoft.icon" sizes="16x16 32x32 48x48 256x256">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">NEON<b>BASTION</b></div>
      <div class="stat" title="코어 내구도"><i class="ico heart"></i><b id="lives">20</b></div>
      <div class="stat" title="골드"><i class="ico coin"></i><b id="gold">0</b></div>
      <div class="stat" title="웨이브"><span>WAVE</span><b id="wave">0</b></div>
      <div id="preview"></div>
      <div class="spacer"></div>
      <button id="btnWave" class="primary">웨이브 시작 <kbd>N</kbd></button>
      <button id="btnSpeed" title="배속 (F)">×1</button>
      <button id="btnPause" title="일시정지 (Space)">일시정지</button>
      <button id="btnMute" title="소리 (M)">소리 켬</button>
      <button id="btnMenu">메뉴</button>
    </header>

    <main id="stage">
      <div id="board">
        <canvas id="cv"></canvas>
        <div id="panel" hidden></div>
      </div>
    </main>

    <footer id="shop"></footer>
  </div>

  <div id="overlay"></div>

  <!-- 빌드 도구 없이 더블클릭으로 실행되도록 일반 스크립트를 의존 순서대로 로드 -->
  <script src="js/config.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
