<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEON BASTION — 타워 디펜스</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">NEON<b>BASTION</b></div>
      <div class="stat" title="코어 내구도"><i class="ico heart"></i><b id="lives">20</b></div>
      <div class="stat" title="골드"><i class="ico coin"></i><b id="gold">0</b></div>
      <div class="stat" title="웨이브"><span>WAVE</span><b id="wave">0</b></div>
      <div id="preview"></div>
      <div class="spacer"></div>
      <button id="btnWave" class="primary">웨이브 시작 <kbd>N</kbd></button>
      <button id="btnSpeed" title="배속 (F)">×1</button>
      <button id="btnPause" title="일시정지 (Space)">일시정지</button>
      <button id="btnMute" title="소리 (M)">소리 켬</button>
      <button id="btnMenu">메뉴</button>
    </header>

    <main id="stage">
      <div id="board">
        <canvas id="cv"></canvas>
        <div id="panel" hidden></div>
      </div>
    </main>

    <footer id="shop"></footer>
  </div>

  <div id="overlay"></div>

  <!-- 빌드 도구 없이 더블클릭으로 실행되도록 일반 스크립트를 의존 순서대로 로드 -->
  <script src="js/config.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
